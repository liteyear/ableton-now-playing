name: Build Mac download
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 scripts/build-mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already published; keeping its existing assets."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "Ableton Now Playing $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          fi
